<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.url }}/" rel="home">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>{{ site.owner.name }}</span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        {% for link in site.data.navigation %}
        {% assign external = false %}
        {% if link.url contains 'http' %}{% assign external = true %}{% endif %}
        <li><a href="{% unless external %}{{ site.url }}{% endunless %}{{ link.url }}"{% if external %} target="_blank" rel="noopener"{% endif %}{% if link.url != '/' and external == false and page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}{% if external %} &#8599;{% endif %}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>
