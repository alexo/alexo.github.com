---
layout: default
---
<article class="container narrow">
  <header class="page-header">
    <h1>{{ page.headline | default: page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-body entry-content">
    {{ content }}
  </div>
</article>
